name: Homologação

# Constrói a imagem de homologação SOMENTE quando alguém aciona (Actions > Homologação > Run workflow).
# Serve para o ciclo: subir um lote de alterações para a main, acionar este workflow, e na VPS rodar
# `homologacao.sh` para baixar a imagem e validar tudo de uma vez. A VPS não faz mais `next build`.
#
# Publica em ghcr.io/<dono>/agentsdr:
#   staging-<commit>   imagem imutável deste commit
#   staging            a última homologação (é a que a VPS baixa)
# Não toca na produção e não publica tags de versão (isso continua no docker.yml).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou commit a construir"
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homologacao
  cancel-in-progress: false

jobs:
  image:
    name: Imagem de homologação
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentsdr:staging-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/agentsdr:staging
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=homologacao
          cache-to: type=gha,scope=homologacao,mode=max
      - run: |
          echo "### Homologação pronta" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${{ steps.sha.outputs.short }}\` publicado como \`staging\`. Na VPS: \`homologacao.sh\`." >> "$GITHUB_STEP_SUMMARY"
